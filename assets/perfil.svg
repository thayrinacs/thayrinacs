<svg xmlns="http://www.w3.org/2000/svg" width="860" height="604" viewBox="0 0 860 604">
<style>
.d1{animation:m1 16s ease-in-out infinite alternate}
.d2{animation:m2 18s ease-in-out infinite alternate}
.d3{animation:m3 14s ease-in-out infinite alternate}
@keyframes m1{0%{transform:translate(0,0)}50%{transform:translate(90px,40px)}100%{transform:translate(-60px,-30px)}}
@keyframes m2{0%{transform:translate(0,0)}50%{transform:translate(-100px,30px)}100%{transform:translate(50px,-40px)}}
@keyframes m3{0%{transform:translate(0,0)}50%{transform:translate(60px,-50px)}100%{transform:translate(-80px,20px)}}
.up{animation:up 1.1s cubic-bezier(.2,.7,.2,1) both}
.up2{animation:up 1.1s .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.scan{animation:sc 6s ease-in-out infinite alternate}
@keyframes sc{from{transform:translateY(-30px)}to{transform:translateY(40px)}}
.scan2{animation:sc2 9s linear infinite alternate}
@keyframes sc2{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.pulse{animation:pu 3s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
